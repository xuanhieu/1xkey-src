name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build XKeyIM
        run: |
          set -o pipefail
          xcodebuild build \
            -project XKey.xcodeproj \
            -scheme XKeyIM \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tail -100
        # The XKeyTests scheme covers only the XKey and XKeyTests targets, so nothing
        # else compiles TapController, XKeyIMController, XKeyIM/main.swift, or the
        # XKeyIM-side build of the shared tap files. Runs first: a compile break is the
        # cheapest failure to report.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project XKey.xcodeproj \
            -scheme XKeyTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -resultBundlePath unit-tests.xcresult \
            2>&1 | tee unit-tests.log
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: |
            unit-tests.log
            unit-tests.xcresult
          if-no-files-found: ignore
      - name: Perf gate (Release, retry 3 — noisy CI runners need multiple tries)
        run: |
          for i in 1 2 3; do
            xcodebuild test -project XKey.xcodeproj -scheme XKeyTests \
              -configuration Release -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" ENABLE_TESTABILITY=YES \
              -only-testing:XKeyTests/KeystrokePerfTests && exit 0
            echo "perf attempt $i failed"
          done
          exit 1
        # ENABLE_TESTABILITY=YES is required here: the project's Release build
        # configuration doesn't set it (only Debug does), so `@testable import XKey`
        # fails to resolve against a plain Release build — verified locally 2026-08-25.

